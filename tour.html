<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tour | Aurelia Tours</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><div id="th"></div><section class="sec"><div class="container"><div class="row g-5"><div class="col-lg-7 rv"><h2>Tour highlights</h2><ul class="hl" id="hl"></ul></div><div class="col-lg-5 rv"><div class="box"><h3 id="pr"></h3><p id="du"></p><a id="bk" class="btn btn-gold w-100">Book this tour</a></div></div></div></div></section><section class="pb-5"><div class="container"><h2 class="mb-4 rv">Glimpses of the journey</h2><div class="row g-3" id="gal"></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>const d=D.find(x=>x.id==new URLSearchParams(location.search).get("id"))||D[0];document.title=d.c+" | Aurelia Tours";$("#th").innerHTML=`<div class="tour-hero" style="--a:${d.g[0]};--b:${d.g[1]}">${pic(d,1600,900,0,"bg")}<div class="container pb-5 position-relative"><h1 class="d-flex align-items-center gap-3">${flag(d.cc,160,"lg")}${d.c}</h1><p class="lead">${d.t}</p></div></div>`;$("#hl").innerHTML=d.h.map(x=>`<li>${x}</li>`).join("");$("#pr").textContent="From "+money(d.p)+" per person";$("#du").textContent=d.d+" days, private guide and hotel stays included.";$("#bk").href="booking.html?id="+d.id;$("#gal").innerHTML=[1,2,3].map(i=>`<div class="col-md-4 rv"><div class="gp">${pic(d,800,600,i,"")}</div></div>`).join("");reveal()</script></body></html>
