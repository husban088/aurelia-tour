<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking | Aurelia Tours</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><section class="phead"><div class="container" style="max-width:760px"><h1 class="rv">Book your tour</h1><form id="f" class="box mt-4 needs-validation" novalidate><div class="row g-3"><div class="col-12"><label class="form-label">Destination</label><select id="dst" class="form-select" required></select></div><div class="col-md-6"><label class="form-label">Full name</label><input id="nm" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email</label><input id="em" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label">Phone</label><input id="ph" class="form-control" required></div><div class="col-md-3"><label class="form-label">Travel date</label><input id="dt" type="date" class="form-control" required></div><div class="col-md-3"><label class="form-label">Guests</label><input id="gs" type="number" min="1" max="12" value="2" class="form-control" required></div><div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3 mt-4"><h3 class="m-0">Total: <span id="tt"></span></h3><button class="btn btn-gold">Confirm booking</button></div></div></form></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>const sel=$("#dst");sel.innerHTML=D.map(d=>`<option value="${d.id}">${d.c} (${money(d.p)} / person)</option>`).join("");sel.value=new URLSearchParams(location.search).get("id")||D[0].id;$("#dt").min=new Date().toISOString().split("T")[0];const tot=()=>{const d=D.find(x=>x.id==sel.value);$("#tt").textContent=money(d.p*(+$("#gs").value||0))};sel.onchange=$("#gs").oninput=tot;tot();$("#f").onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.checkValidity()){f.classList.add("was-validated");return}const d=D.find(x=>x.id==sel.value),g=+$("#gs").value,b=getB();b.push({id:Date.now(),name:$("#nm").value.trim(),email:$("#em").value.trim(),phone:$("#ph").value.trim(),country:d.c,flag:d.f,date:$("#dt").value,guests:g,total:d.p*g,status:"Pending",created:new Date().toLocaleDateString()});setB(b);toast("Booking saved. Taking you to the dashboard…");setTimeout(()=>location.href="dashboard.html",1400)}</script></body></html>
