<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Aurelia Tours</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><section class="phead"><div class="container"><h1 class="rv">Bookings dashboard</h1><div class="row g-3 my-3" id="k"></div><div class="row g-4"><div class="col-lg-4"><div class="box h-100"><h3>Bookings by country</h3><div id="bars"></div></div></div><div class="col-lg-8"><div class="box"><div class="row g-2 mb-3"><div class="col-md-7"><input id="q" class="form-control" placeholder="Search name or email…"></div><div class="col-md-5"><select id="c" class="form-select"><option value="">All countries</option></select></div></div><div class="table-responsive"><table class="table"><thead><tr><th>Traveller</th><th>Country</th><th>Date</th><th>Guests</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>$("#c").innerHTML+=D.map(d=>`<option>${d.c}</option>`).join("");function draw(){const all=getB(),q=$("#q").value.toLowerCase(),c=$("#c").value,a=all.filter(b=>(!c||b.country==c)&&(b.name+b.email).toLowerCase().includes(q)),rev=all.reduce((s,b)=>s+b.total,0),cnt={};all.forEach(b=>cnt[b.country]=(cnt[b.country]||0)+1);const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0];$("#k").innerHTML=[["Total bookings",all.length],["Revenue",money(rev)],["Travellers",all.reduce((s,b)=>s+b.guests,0)],["Top country",top?top[0]:"None yet"]].map(k=>`<div class="col-6 col-lg-3"><div class="kpi"><b>${k[1]}</b>${k[0]}</div></div>`).join("");const mx=top?top[1]:1;$("#bars").innerHTML=top?Object.entries(cnt).map(([k,v])=>`<div class="mb-3"><div class="d-flex justify-content-between"><span>${k}</span><b>${v}</b></div><div class="bar"><i data-w="${v/mx*100}"></i></div></div>`).join(""):"<p class=empty>No bookings yet.</p>";setTimeout(()=>$$(".bar i").forEach(i=>i.style.width=i.dataset.w+"%"),50);$("#tb").innerHTML=a.length?a.map(b=>`<tr><td><b>${b.name}</b><br><small>${b.email}<br>${b.phone}</small></td><td>${flag((D.find(x=>x.c==b.country)||{cc:"un"}).cc,40,"sm")}${b.country}</td><td>${b.date}</td><td>${b.guests}</td><td>${money(b.total)}</td><td><button class="btn btn-sm ${b.status=="Confirmed"?"btn-success":"btn-warning"}" onclick="st(${b.id})">${b.status}</button></td><td><button class="btn btn-sm btn-outline-danger" onclick="del(${b.id})"><i class="bi bi-trash"></i></button></td></tr>`).join(""):`<tr><td colspan=7 class="empty">No bookings to show. <a href="destinations.html">Book a tour</a></td></tr>`}window.st=id=>{const a=getB();const b=a.find(x=>x.id==id);b.status=b.status=="Pending"?"Confirmed":"Pending";setB(a);draw()};window.del=id=>{if(confirm("Delete this booking?")){setB(getB().filter(x=>x.id!=id));draw()}};$("#q").oninput=$("#c").onchange=draw;draw();reveal()</script></body></html>
