<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destinations | Aurelia Tours</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div><section class="phead"><div class="container"><h1 class="rv">All destinations</h1><div class="row g-3 mt-3"><div class="col-md-8"><input id="q" class="form-control" placeholder="Search a country…"></div><div class="col-md-4"><select id="s" class="form-select"><option value="0">Sort: featured</option><option value="1">Price: low to high</option><option value="2">Price: high to low</option></select></div></div></div></section><section class="pb-5"><div class="container"><div class="row g-4" id="grid"></div></div></section><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>function draw(){let q=$("#q").value.toLowerCase(),s=$("#s").value,a=D.filter(d=>d.c.toLowerCase().includes(q));if(s==1)a.sort((x,y)=>x.p-y.p);if(s==2)a.sort((x,y)=>y.p-x.p);$("#grid").innerHTML=a.length?a.map(card).join(""):"<p class=empty>No country matches your search.</p>";reveal()}$("#q").oninput=$("#s").onchange=draw;draw()</script></body></html>
